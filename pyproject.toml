[project]
name = "vacuum-ballet"
version = "0.1.0"
description = "A safe, agent-friendly control layer for Roborock vacuums"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-roborock>=7.1.1,<8",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.1",
]

[project.scripts]
vacuum-ballet = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
